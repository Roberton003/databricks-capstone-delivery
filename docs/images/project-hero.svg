<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">Stock-Market Research Assistant - Databricks AI Capstone</title>
  <desc id="desc">Assistente de mercado de ações com gráficos de velas Candlestick, RAG vetorial e Databricks Spark</desc>
  <style>
    :root{ --bg:#0b1120; --green:#22c55e; --red:#ef4444; --orange:#f97316; --cyan:#38bdf8; --ink:#f0f9ff; --sub:#94a3b8; }
    *{transform-box:fill-box;}
    @keyframes candlePulse {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .candle { animation: candlePulse 3s ease-in-out infinite alternate; }
    @keyframes vectorSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .vectorMesh {
      transform-origin: 640px 180px;
      animation: vectorSpin 12s linear infinite;
    }
  </style>
  <rect width="800" height="360" fill="var(--bg)" rx="12"/>
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
  </g>
  <g class="candle" transform="translate(60, 100)">
    <line x1="30" y1="10" x2="30" y2="150" stroke="var(--green)" stroke-width="2"/>
    <rect x="20" y="40" width="20" height="70" fill="var(--green)" rx="2"/>
    <line x1="80" y1="30" x2="80" y2="160" stroke="var(--red)" stroke-width="2"/>
    <rect x="70" y="50" width="20" height="80" fill="var(--red)" rx="2"/>
    <line x1="130" y1="20" x2="130" y2="140" stroke="var(--green)" stroke-width="2"/>
    <rect x="120" y="30" width="20" height="90" fill="var(--green)" rx="2"/>
    <line x1="180" y1="10" x2="180" y2="170" stroke="var(--green)" stroke-width="2"/>
    <rect x="170" y="20" width="20" height="120" fill="var(--green)" rx="2"/>
    <path d="M 20,90 Q 70,110 120,60 T 220,30" fill="none" stroke="var(--cyan)" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="translate(640, 180)">
    <circle r="70" fill="none" stroke="#1e293b" stroke-width="2"/>
    <g class="vectorMesh">
      <circle cx="0" cy="-50" r="6" fill="var(--cyan)"/>
      <circle cx="45" cy="25" r="6" fill="var(--orange)"/>
      <circle cx="-45" cy="25" r="6" fill="var(--green)"/>
      <circle cx="0" cy="0" r="10" fill="var(--orange)"/>
      <line x1="0" y1="-50" x2="0" y2="0" stroke="var(--cyan)" stroke-width="1.5"/>
      <line x1="45" y1="25" x2="0" y2="0" stroke="var(--orange)" stroke-width="1.5"/>
      <line x1="-45" y1="25" x2="0" y2="0" stroke="var(--green)" stroke-width="1.5"/>
    </g>
    <text x="0" y="95" font-size="11" font-weight="700" fill="var(--cyan)" text-anchor="middle" font-family="system-ui">RAG PGVECTOR (45ms)</text>
  </g>
  <g transform="translate(300, 40)">
    <rect x="0" y="0" width="240" height="90" rx="10" fill="#1e293b" stroke="var(--orange)" stroke-width="1.5"/>
    <text x="16" y="24" font-size="11" font-weight="700" fill="var(--orange)" font-family="system-ui">DATABRICKS SPARK &amp; MCP</text>
    <text x="16" y="52" font-size="14" font-weight="900" fill="var(--ink)" font-family="system-ui">Stock Research AI Agent</text>
    <text x="16" y="74" font-size="10" fill="var(--sub)" font-family="system-ui">SEC Filings &amp; Financial Analysis</text>
  </g>
</svg>