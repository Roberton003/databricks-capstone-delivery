# Batch job for generating weather pgvector embeddings.
# Deploy: databricks bundle deploy -t dev
# Run manually after /weather/sync has populated weather_documents.

resources:
  jobs:
    ingest_weather_embeddings_job:
      name: "[${bundle.target}] Ingest Weather Embeddings"
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 7 * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      tasks:
        - task_key: ingest_weather_embeddings
          notebook_task:
            notebook_path: ../notebooks/ingest_weather_embeddings.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - "sentence-transformers>=3.0.0"
              - "psycopg2-binary>=2.9.9"
              - "databricks-sdk>=0.65.0"
              - "sqlalchemy>=2.0.30"
              - "requests>=2.31.0"
              - "flask>=3.0.3"
              - "python-dotenv>=1.0.1"
              - "numpy<2"
