# Databricks Workflow for dashboard app
# Deploy: databricks bundle deploy -t dev

resources:
  jobs:
    dashboard:
      name: "[${bundle.target}] Dashboard App"
      cluster_spec:
        spark_version: "15.4.x-scala2.12"
        node_type_id: "i3.xlarge"
        num_workers: 1
        data_security_mode: SINGLE_USER
      spark_python_task:
        python_file: ../dashboard/app.py
        parameters:
          - "--port"
          - "8001"
