# pyproject.toml

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "databricks-capstone-delivery"
version = "4.0.0"
description = "Stock-Market Research Assistant - Databricks AI Bootcamp Capstone"
readme = "README.md"
license = {text = "Copyright (c) 2026 Roberto"}
authors = [
    {name = "Roberto", email = "roberto@example.com"}
]

requires-python = ">=3.10"

dependencies = [
    "databricks-sdk>=0.1.0",
    "flask>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "requests>=2.28.0",
    "trafilatura>=1.2.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "black>=23.0.0",
]

[project.urls]
Homepage = "https://github.com/Roberton003/databricks-capstone-delivery"
Documentation = "https://github.com/Roberton003/databricks-capstone-delivery/blob/main/README.md"
Repository = "https://github.com/Roberton003/databricks-capstone-delivery"
"Bug Tracker" = "https://github.com/Roberton003/databricks-capstone-delivery/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["*", "dashboard.*", "mcp_server.*"]

[tool.setuptools.package-data]
"dashboard" = ["templates/*.html"]
"mcp_server" = ["*.yaml"]
