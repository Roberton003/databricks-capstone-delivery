# Databricks Asset Bundle config for Day 3 migration.
# Deploy with: databricks bundle deploy -t dev
# Requires Agent Bricks configuration in Databricks workspace.

bundle:
  name: databricks-lakebase-app-day-3

include:
  - resources/ingest_weather_embeddings_job.yml

sync:
  include:
    - dashboard/**
    - notebooks/ingest_weather_embeddings.py
    - sql/**
    - resources/ingest_weather_embeddings_job.yml
    - databricks.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: dbc-ab479437-b1bb
      host: https://dbc-ab479437-b1bb.cloud.databricks.com

  prod:
    mode: production
    workspace:
      profile: dbc-ab479437-b1bb
      host: https://dbc-ab479437-b1bb.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
