# Databricks Asset Bundle config for Day 3 migration.
# Deploy with: databricks bundle deploy -t dev
# Requires Agent Bricks configuration in Databricks workspace.

bundle:
  name: databricks-lakebase-app-day-3

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://<your-workspace-instance>.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://<your-workspace-instance>.cloud.databricks.com
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
